name: Signed APK Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for the release (e.g. 1.2.0). Leave empty to use tag or date.'
        required: false
        default: ''
      create_github_release:
        description: 'Create a GitHub Release with the APK/AAB attached'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK/AAB & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            V="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0-ci.$(date -u +%Y%m%d%H%M)"
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=v$V" >> $GITHUB_OUTPUT
          echo "Resolved version: $V"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.PROD_SUPABASE_ANON_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Generate icons
        run: |
          if [ -f scripts/generate_android_icons.js ]; then
            node scripts/generate_android_icons.js
          fi

      - name: Grant Gradle execute
        run: chmod +x gradlew
        working-directory: android

      - name: Ensure Gradle wrapper JAR
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar || true
          fi

      - name: Decode release keystore
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -f ../scripts/decode_keystore.py ]; then
            python3 ../scripts/decode_keystore.py
          else
            echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
            cp upload-keystore.jks app/upload-keystore.jks 2>/dev/null || true
          fi
          test -s upload-keystore.jks || test -s app/upload-keystore.jks
          chmod 600 upload-keystore.jks app/upload-keystore.jks 2>/dev/null || true

      - name: Validate keystore
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          if [ -f ../scripts/validate_keystore.py ]; then
            python3 ../scripts/validate_keystore.py
          else
            echo "validate_keystore.py not found — skipping SHA print"
          fi

      - name: Assemble signed release APK + AAB
        working-directory: android
        env:
          KEYSTORE_FILE: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.PROD_SUPABASE_ANON_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon
          ls -la app/build/outputs/apk/release/ || true
          ls -la app/build/outputs/bundle/release/ || true

      - name: Stage release assets
        id: assets
        run: |
          mkdir -p dist-release
          APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          cp "$APK" "dist-release/Relay-${VERSION}-release.apk"
          [ -n "$AAB" ] && cp "$AAB" "dist-release/Relay-${VERSION}-release.aab"
          echo "apk=dist-release/Relay-${VERSION}-release.apk" >> $GITHUB_OUTPUT
          if [ -n "$AAB" ]; then
            echo "aab=dist-release/Relay-${VERSION}-release.aab" >> $GITHUB_OUTPUT
          fi
          ls -la dist-release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relay-signed-release-${{ steps.ver.outputs.version }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.create_github_release == 'true' || github.event.inputs.create_github_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES="## Relay ${VERSION}

          Signed Android release built from \`${GITHUB_SHA}\`.

          ### Assets
          - \`Relay-${VERSION}-release.apk\` — installable APK
          - \`Relay-${VERSION}-release.aab\` — Play Store bundle (if present)

          ### Install
          1. Download the APK
          2. Allow installs from unknown sources if needed
          3. Open the APK on your device

          Built with the project release keystore from repository secrets."

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            git tag "$TAG" || true
            git push origin "$TAG" || true
          fi

          FILES=(dist-release/*.apk)
          if ls dist-release/*.aab >/dev/null 2>&1; then
            FILES+=(dist-release/*.aab)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Relay ${VERSION}" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Cleanup keystore
        if: always()
        working-directory: android
        run: rm -f upload-keystore.jks app/upload-keystore.jks key.properties app/key.properties 2>/dev/null || true
