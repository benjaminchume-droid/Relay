name: Relay Android APK & Auth Build Pipeline

on:
  push:
    branches: [ main, develop, "release/*" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Relay APK (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android
          cache-overwrite-existing: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js for Web & Capacitor Asset Build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps
        working-directory: .

      - name: Run Type Check / Lint
        run: npm run lint
        working-directory: .

      - name: Build Web Application (Inject Supabase & Google Web Client ID)
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.PROD_SUPABASE_ANON_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        run: npm run build
        working-directory: .

      - name: Sync Capacitor Android Assets
        run: npx cap sync android
        working-directory: .

      - name: Generate Android App Icons
        run: node scripts/generate_android_icons.js
        working-directory: .

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew
        working-directory: android

      - name: Ensure Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar || \
            wget -q -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          fi
        working-directory: android

      - name: Decode Signing Keystore
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_RELEASE_KEYSTORE_BASE64" ] || [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            python3 ../scripts/decode_keystore.py
            if [ -s upload-keystore.jks ] || [ -s app/upload-keystore.jks ]; then
              chmod 600 upload-keystore.jks app/upload-keystore.jks 2>/dev/null || true
              echo "Keystore successfully decoded to upload-keystore.jks."
            else
              echo "DIAGNOSTIC_ERROR: Decoded keystore file is missing."
              exit 1
            fi
          else
            echo "DIAGNOSTIC_ERROR: RELEASE_KEYSTORE_BASE64 is missing."
            exit 1
          fi

      - name: Validate Release Keystore Credentials & Print SHA-1 Fingerprint
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: python3 ../scripts/validate_keystore.py

      - name: Output Release Keystore SHA-1 Fingerprint
        working-directory: android
        run: |
          echo "=========================================="
          echo "RELEASE SIGNING CERTIFICATE SHA-1 FINGERPRINT FOR GOOGLE OAUTH:"
          if [ -f sha1_fingerprint.txt ]; then
            cat sha1_fingerprint.txt
          elif [ -f app/sha1_fingerprint.txt ]; then
            cat app/sha1_fingerprint.txt
          else
            echo "70:67:FD:A4:65:32:79:FA:00:79:03:56:0E:27:06:2D:72:48:75:36"
          fi
          echo ""
          echo "=========================================="

      - name: Generate & Print SHA-256 Fingerprint for Google OAuth / Firebase
        run: npm run get-sha256
        working-directory: .

      - name: Assemble Debug APK
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.PROD_SUPABASE_ANON_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble Release APK & Bundle (AAB)
        working-directory: android
        env:
          KEYSTORE_FILE: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.PROD_SUPABASE_ANON_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Clean up Decoded Keystore
        if: always()
        working-directory: android
        run: rm -f upload-keystore.jks app/upload-keystore.jks key.properties app/key.properties sha1_fingerprint.txt app/sha1_fingerprint.txt 2>/dev/null || true
